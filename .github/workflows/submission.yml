name: submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  check:
    if: contains(github.event.issue.labels.*.name, 'submission') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run the repo checks and answer on the issue
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run catalog:submission

      - name: Commit the accepted submission
        if: steps.check.outputs.accepted != ''
        env:
          ACCEPTED: ${{ steps.check.outputs.accepted }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/submissions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "catalog: accept submission $ACCEPTED"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push
